<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
<rect x="0" y="0" width="880" height="460" fill="#F4F2ED"/>
<rect x="48" y="36" width="18" height="18" fill="#E2001A"/>
<text x="78" y="52" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#111111">Nominal 90% interval — actual coverage</text>
<text x="48" y="82" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="14" fill="#595959">Actual coverage of a nominal 90% interval, by evaluation window</text>
<!-- nominal line -->
<line x1="732" y1="104" x2="732" y2="336" stroke="#111111" stroke-width="2" stroke-dasharray="7 6"/>
<text x="732" y="96" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">Nominal 90%</text>
<!-- bar 1 -->
<text x="48" y="138" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#111111">Annual evaluation</text>
<text x="812" y="138" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E2001A" text-anchor="end">82–85%</text>
<rect x="48" y="148" width="760" height="48" fill="#D8D5CE"/>
<rect x="48" y="148" width="634.6" height="48" fill="#E2001A"/>
<text x="64" y="178" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">≈83.5%</text>
<!-- bar 2 -->
<text x="48" y="238" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#111111">2014 cold-event window</text>
<text x="812" y="238" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E2001A" text-anchor="end">31–33%</text>
<rect x="48" y="248" width="760" height="48" fill="#D8D5CE"/>
<rect x="48" y="248" width="243.2" height="48" fill="#E2001A"/>
<text x="64" y="278" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">≈32%</text>
<!-- axis -->
<line x1="48" y1="336" x2="808" y2="336" stroke="#111111" stroke-width="2"/>
<text x="48" y="360" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#595959">0%</text>
<text x="428" y="360" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#595959" text-anchor="middle">50%</text>
<text x="808" y="360" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#595959" text-anchor="end">100%</text>
<!-- note -->
<line x1="48" y1="386" x2="832" y2="386" stroke="#D8D5CE" stroke-width="1"/>
<text x="48" y="410" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#595959">Source: PJM polar-vortex study, in-progress manuscript. Ranges as recorded in the</text>
<text x="48" y="430" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#595959">research record.</text>
</svg>
